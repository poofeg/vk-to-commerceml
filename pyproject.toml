[project]
name = "vk-to-commerceml"
version = "0.1.0"
description = "Telegram bot that can synchronize VK products to a website using the CommerceML protocol"
authors = [
    { name = "Alexey Vaganov", email = "poofeg@gmail.com" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiogram[redis] (>=3.26.0,<4.0.0)",
    "aiohttp[speedups] (>=3.13.5,<4.0.0)",
    "cryptography (>=46.0.6,<47.0.0)",
    "fastapi (>=0.135.3,<0.136.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "pydantic-xml[lxml] (>=2.19.0,<3.0.0)",
    "typer[all] (>=0.24.1,<0.25.0)",
    "uvicorn[standard] (>=0.43.0,<0.44.0)",
]

[project.urls]
repository = "https://github.com/poofeg/vk-to-commerceml"

[dependency-groups]
dev = [
    "mypy[dmypy] (>=1.20.0,<2.0.0)",
    "ruff (>=0.15.9,<0.16.0)",
    "types-aiofiles (>=25.1.0.20251011,<26.0.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
preview = true
select = [
    "E",
    "F",
    "FAST",
    "I",
    "Q",
    "UP",
    "W",
]

[tool.mypy]
plugins = ["pydantic_xml.mypy"]
python_version = "3.14"
platform = "linux"
follow_imports = "normal"
ignore_missing_imports = false
mypy_path = "stubs"
strict = true
